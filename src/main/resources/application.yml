spring:
  profiles:
    default: local
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/sales_summery}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd'T'HH:mm:ss
  mvc:
    format:
      date: yyyy-MM-dd
  flyway:
    enabled: true

security:
  jwt:
    secret: ${JWT_SECRET:dev-local-jwt-secret-key-32-bytes}
    expiration: 1h
