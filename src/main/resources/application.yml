spring:
  datasource:
    url: "${DB_URL:jdbc:postgresql://localhost:5432/sales_summery}"
    username: "${DB_USERNAME:postgres}"
    password: "${DB_PASSWORD:}"
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
