<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Summery API Tester</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <div><span class="eyebrow">SALES SUMMERY</span><h1>API 테스트 보드</h1></div>
    <div id="auth-status" class="status">로그인하지 않음</div>
  </header>

  <main>
    <section class="panel intro">
      <div><h2>빠른 기능 확인</h2><p>회원가입 또는 로그인 후 항목과 기록을 만들고 집계를 확인하세요.</p></div>
      <button id="logout" class="ghost">토큰 삭제</button>
    </section>

    <div class="workspace">
      <div class="forms">
        <section class="panel">
          <h2>1. 인증</h2>
          <div class="grid two">
            <form id="signup-form">
              <h3>회원가입</h3>
              <label>로그인 ID<input name="loginId" value="tester01" required></label>
              <label>비밀번호<input name="password" type="password" value="password123" required></label>
              <label>이름<input name="name" value="테스트 사용자" required></label>
              <button>회원가입</button>
            </form>
            <form id="login-form">
              <h3>로그인</h3>
              <label>로그인 ID<input name="loginId" value="tester01" required></label>
              <label>비밀번호<input name="password" type="password" value="password123" required></label>
              <button>로그인</button>
              <button type="button" class="ghost" data-api="GET /users/me">내 정보 조회</button>
            </form>
          </div>
        </section>

        <section class="panel">
          <h2>2. 항목</h2>
          <div class="toolbar"><button data-api="GET /categories?activeOnly=false">전체 항목 조회</button><button class="ghost" data-api="GET /categories?activeOnly=true">활성 항목만</button></div>
          <form id="category-form" class="grid four">
            <label>항목명<input name="categoryName" value="기타 매출" required></label>
            <label>거래 유형<select name="transactionType"><option>INCOME</option><option>EXPENSE</option></select></label>
            <label>비용 유형<select name="costType"><option>NONE</option><option>FIXED</option><option>VARIABLE</option></select></label>
            <label>주기<select name="frequency"><option>IRREGULAR</option><option>DAILY</option><option>MONTHLY</option></select></label>
            <button>항목 추가</button>
          </form>
        </section>

        <section class="panel">
          <h2>3. 수입·지출 기록</h2>
          <form id="record-form" class="grid four">
            <label>항목 ID<input name="categoryId" type="number" min="1" required></label>
            <label>날짜<input name="recordDate" type="date" required></label>
            <label>금액<input name="amount" type="number" min="1" value="10000" required></label>
            <label>메모<input name="memo" value="브라우저 테스트"></label>
            <button>기록 등록</button>
          </form>
          <form id="record-search-form" class="grid three compact">
            <label>시작일<input name="startDate" type="date" required></label>
            <label>종료일<input name="endDate" type="date" required></label>
            <button>기간 기록 조회</button>
          </form>
        </section>

        <section class="panel">
          <h2>4. 특이사항</h2>
          <form id="note-form" class="grid three">
            <label>날짜<input name="noteDate" type="date" required></label>
            <label class="wide">내용<input name="content" value="오늘의 특이사항" required></label>
            <button>특이사항 등록</button>
          </form>
        </section>

        <section class="panel">
          <h2>5. 대시보드</h2>
          <div class="toolbar">
            <button data-api="GET /dashboard/today">오늘 집계</button>
            <button data-api="GET /dashboard/current-settlement">현재 정산 기간</button>
            <button data-api="GET /dashboard/recent">최근 기록 5건</button>
          </div>
          <form id="summary-form" class="grid three compact">
            <label>시작일<input name="startDate" type="date" required></label>
            <label>종료일<input name="endDate" type="date" required></label>
            <button>선택 기간 집계</button>
          </form>
        </section>
      </div>

      <aside class="panel console-panel">
        <div class="console-title"><div><span id="method">READY</span><strong id="request-path">요청 대기 중</strong></div><button id="clear" class="ghost small">지우기</button></div>
        <pre id="response">회원가입 또는 로그인을 실행해보세요.</pre>
      </aside>
    </div>
  </main>
  <script src="/app.js"></script>
</body>
</html>
