openapi: 3.1.0
info:
  title: Sales Summery API
  version: 1.0.0
  description: 소규모 사업장 수입·지출 관리 API
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/signup:
    post:
      security: []
      summary: 회원가입 및 기본 항목 생성
      responses:
        '201': { description: 생성 성공 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 로그인 아이디 중복 }
  /auth/login:
    post:
      security: []
      summary: 로그인 및 JWT Access Token 발급
      responses:
        '200': { description: 로그인 성공 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me:
    get:
      summary: 내 정보 조회
      responses: { '200': { description: 성공 }, '401': { $ref: '#/components/responses/Unauthorized' } }
    delete:
      summary: 회원 탈퇴
      responses: { '200': { description: 성공 }, '400': { $ref: '#/components/responses/BadRequest' } }
  /users/me/name:
    patch:
      summary: 이름 변경
      responses: { '200': { description: 성공 } }
  /users/me/settlement-start-day:
    get:
      summary: 정산 시작일 조회
      responses: { '200': { description: 성공 } }
    patch:
      summary: 정산 시작일 변경
      responses: { '200': { description: 성공 }, '400': { $ref: '#/components/responses/BadRequest' } }
  /users/me/password:
    patch:
      summary: 비밀번호 변경
      responses: { '200': { description: 성공 }, '400': { $ref: '#/components/responses/BadRequest' } }
  /categories:
    get:
      summary: 전체 또는 활성 항목 목록
      parameters:
        - { name: activeOnly, in: query, schema: { type: boolean, default: false } }
      responses: { '200': { description: 성공 } }
    post:
      summary: 항목 생성
      responses: { '201': { description: 생성 성공 }, '409': { description: 항목명 중복 } }
  /categories/{categoryId}:
    get:
      summary: 항목 상세 조회
      parameters: [ { $ref: '#/components/parameters/CategoryId' } ]
      responses: { '200': { description: 성공 }, '404': { description: 항목 없음 } }
  /categories/{categoryId}/name:
    patch:
      summary: 항목 이름 변경
      parameters: [ { $ref: '#/components/parameters/CategoryId' } ]
      responses: { '200': { description: 성공 } }
  /categories/{categoryId}/activate:
    patch:
      summary: 항목 활성화
      parameters: [ { $ref: '#/components/parameters/CategoryId' } ]
      responses: { '200': { description: 성공 } }
  /categories/{categoryId}/deactivate:
    patch:
      summary: 항목 비활성화
      parameters: [ { $ref: '#/components/parameters/CategoryId' } ]
      responses: { '200': { description: 성공 } }
  /financial-records:
    get:
      summary: 기록 기간 검색·필터·페이징
      parameters:
        - { name: startDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: endDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: transactionType, in: query, schema: { $ref: '#/components/schemas/TransactionType' } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: sort, in: query, schema: { type: string, default: 'recordDate,desc' } }
      responses: { '200': { description: 성공 } }
    post:
      summary: 기록 등록
      responses: { '201': { description: 생성 성공 }, '400': { $ref: '#/components/responses/BadRequest' } }
  /financial-records/{recordId}:
    get:
      summary: 기록 상세 조회
      parameters: [ { $ref: '#/components/parameters/RecordId' } ]
      responses: { '200': { description: 성공 }, '404': { description: 기록 없음 } }
    patch:
      summary: 기록 수정 및 항목 변경
      parameters: [ { $ref: '#/components/parameters/RecordId' } ]
      responses: { '200': { description: 성공 } }
    delete:
      summary: 기록 삭제
      parameters: [ { $ref: '#/components/parameters/RecordId' } ]
      responses: { '200': { description: 성공 } }
  /daily-notes:
    get:
      summary: 기간별 특이사항 조회
      responses: { '200': { description: 성공 } }
    post:
      summary: 특이사항 등록
      responses: { '201': { description: 생성 성공 }, '409': { description: 날짜 중복 } }
  /daily-notes/date/{date}:
    get:
      summary: 특정 날짜 특이사항 조회
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: 성공 }, '404': { description: 특이사항 없음 } }
  /daily-notes/{noteId}:
    patch:
      summary: 특이사항 수정
      responses: { '200': { description: 성공 } }
    delete:
      summary: 특이사항 삭제
      responses: { '200': { description: 성공 } }
  /dashboard/today:
    get:
      summary: 오늘 손익
      responses: { '200': { description: 성공 } }
  /dashboard/current-settlement:
    get:
      summary: 현재 정산 기간 손익
      responses: { '200': { description: 성공 } }
  /dashboard/summary:
    get:
      summary: 선택 기간 손익
      responses: { '200': { description: 성공 } }
  /dashboard/category-totals:
    get:
      summary: 기간별 항목 합계
      responses: { '200': { description: 성공 } }
  /dashboard/recent:
    get:
      summary: 최근 기록 5건
      responses: { '200': { description: 성공 } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CategoryId: { name: categoryId, in: path, required: true, schema: { type: integer, format: int64 } }
    RecordId: { name: recordId, in: path, required: true, schema: { type: integer, format: int64 } }
  schemas:
    TransactionType: { type: string, enum: [INCOME, EXPENSE] }
    Error:
      type: object
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    BadRequest: { description: 요청값 오류 }
    Unauthorized: { description: 인증 실패 }
