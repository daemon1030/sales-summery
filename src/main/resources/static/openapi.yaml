openapi: 3.1.0
info:
  title: Sales Summery API
  version: 1.0.0
  description: 소규모 사업장 수입·지출 관리 API
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/signup:
    post:
      security: []
      summary: 회원가입 및 기본 항목 생성
      responses:
        '201': { description: 생성 성공 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 로그인 아이디 중복 }
  /auth/login:
    post:
      security: []
      summary: 로그인 및 JWT Access Token 발급
      responses:
        '200': { description: 로그인 성공 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /users/me:
    get:
      summary: 내 정보 조회
      responses: { '200': { description: 성공 }, '401': { $ref: '#/components/responses/Unauthorized' } }
    delete:
      summary: 회원 탈퇴
      responses: { '200': { description: 성공 }, '400': { $ref: '#/components/responses/BadRequest' } }
  /users/me/name:
    patch:
      summary: 이름 변경
      responses: { '200': { description: 성공 } }
  /users/me/settlement-start-day:
    get:
      summary: 정산 시작일 조회
      responses: { '200': { description: 성공 } }
    patch:
      summary: 정산 시작일 변경
      responses: { '200': { description: 성공 }, '400': { $ref: '#/components/responses/BadRequest' } }
  /users/me/password:
    patch:
      summary: 비밀번호 변경
      responses: { '200': { description: 성공 }, '400': { $ref: '#/components/responses/BadRequest' } }
  /categories:
    get:
      summary: 전체 또는 활성 항목 목록
      parameters:
        - { name: activeOnly, in: query, schema: { type: boolean, default: false } }
      responses: { '200': { description: 성공 } }
    post:
      summary: 항목 생성
      responses: { '201': { description: 생성 성공 }, '409': { description: 항목명 중복 } }
  /categories/{categoryId}:
    get:
      summary: 항목 상세 조회
      parameters: [ { $ref: '#/components/parameters/CategoryId' } ]
      responses: { '200': { description: 성공 }, '404': { description: 항목 없음 } }
  /categories/{categoryId}/name:
    patch:
      summary: 항목 이름 변경
      parameters: [ { $ref: '#/components/parameters/CategoryId' } ]
      responses: { '200': { description: 성공 } }
  /categories/{categoryId}/activate:
    patch:
      summary: 항목 활성화
      parameters: [ { $ref: '#/components/parameters/CategoryId' } ]
      responses: { '200': { description: 성공 } }
  /categories/{categoryId}/deactivate:
    patch:
      summary: 항목 비활성화
      parameters: [ { $ref: '#/components/parameters/CategoryId' } ]
      responses: { '200': { description: 성공 } }
  /financial-records:
    get:
      summary: 기록 기간 검색·필터·페이징
      parameters:
        - { name: startDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: endDate, in: query, required: true, schema: { type: string, format: date } }
        - { name: categoryId, in: query, schema: { type: integer, format: int64 } }
        - { name: transactionType, in: query, schema: { $ref: '#/components/schemas/TransactionType' } }
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: sort, in: query, schema: { type: string, default: 'recordDate,desc' } }
      responses: { '200': { description: 성공 } }
    post:
      summary: 기록 등록
      responses: { '201': { description: 생성 성공 }, '400': { $ref: '#/components/responses/BadRequest' } }
  /financial-records/{recordId}:
    get:
      summary: 기록 상세 조회
      parameters: [ { $ref: '#/components/parameters/RecordId' } ]
      responses: { '200': { description: 성공 }, '404': { description: 기록 없음 } }
    patch:
      summary: 기록 수정 및 항목 변경
      parameters: [ { $ref: '#/components/parameters/RecordId' } ]
      responses: { '200': { description: 성공 } }
  /financial-record-imports/template:
    get:
      summary: 가계부 엑셀 기본 양식 다운로드
      responses:
        '200':
          description: 기본 열과 작성 예시가 포함된 XLSX 파일
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
  /financial-record-imports/analyze:
    post:
      summary: 여러 가계부 엑셀 파일 분석
      description: 기존 활성 카테고리는 자동 연결하고 처음 발견한 금액 열은 설정 대상으로 반환한다. 이 단계에서는 DB에 거래를 저장하지 않는다.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  maxItems: 50
                  items: { type: string, format: binary }
      responses:
        '200':
          description: 파일·열 분석 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/ImportAnalysis' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /financial-record-imports/{importToken}/confirm:
    post:
      summary: 엑셀 가져오기 확정
      description: 신규 열 설정을 적용하고 카테고리, 거래 기록, 특이사항 및 파일 가져오기 이력을 하나의 트랜잭션으로 저장한다.
      parameters:
        - name: importToken
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmImportRequest' }
      responses:
        '200':
          description: 가져오기 결과
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/ImportResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { description: 만료되었거나 존재하지 않는 가져오기 정보 }
    delete:
      summary: 기록 삭제
      parameters: [ { $ref: '#/components/parameters/RecordId' } ]
      responses: { '200': { description: 성공 } }
  /daily-notes:
    get:
      summary: 기간별 특이사항 조회
      responses: { '200': { description: 성공 } }
    post:
      summary: 특이사항 등록
      responses: { '201': { description: 생성 성공 }, '409': { description: 날짜 중복 } }
  /daily-notes/date/{date}:
    get:
      summary: 특정 날짜 특이사항 조회
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      responses: { '200': { description: 성공 }, '404': { description: 특이사항 없음 } }
  /daily-notes/{noteId}:
    patch:
      summary: 특이사항 수정
      responses: { '200': { description: 성공 } }
    delete:
      summary: 특이사항 삭제
      responses: { '200': { description: 성공 } }
  /dashboard/today:
    get:
      summary: 오늘 손익
      responses: { '200': { description: 성공 } }
  /dashboard/current-settlement:
    get:
      summary: 현재 정산 기간 손익
      responses: { '200': { description: 성공 } }
  /dashboard/summary:
    get:
      summary: 선택 기간 손익
      responses: { '200': { description: 성공 } }
  /dashboard/category-totals:
    get:
      summary: 기간별 항목 합계
      responses: { '200': { description: 성공 } }
  /dashboard/profit-trend:
    get:
      summary: 일별·월별·연별 손익 추이
      description: 조회 단위에 따라 기간별 수입, 지출, 순이익을 반환하며 기록이 없는 기간은 0으로 채운다.
      parameters:
        - { name: unit, in: query, required: true, schema: { $ref: '#/components/schemas/TrendUnit' } }
        - { name: startDate, in: query, schema: { type: string, format: date }, description: 일별 조회 시작일 }
        - { name: endDate, in: query, schema: { type: string, format: date }, description: 일별 조회 종료일 }
        - { name: year, in: query, schema: { type: integer }, description: 월별 조회 연도 }
        - { name: startYear, in: query, schema: { type: integer }, description: 연별 조회 시작 연도 }
        - { name: endYear, in: query, schema: { type: integer }, description: 연별 조회 종료 연도 }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/ProfitTrendPoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /dashboard/category-breakdown:
    get:
      summary: 선택 정산월의 수입·지출 항목별 비교
      description: 선택한 연월과 사용자의 정산 시작일로 계산한 정산 기간의 항목별 합계를 반환한다. 예를 들어 정산 시작일이 8일이면 2026-08은 2026-08-08부터 2026-09-07까지이다.
      parameters:
        - { name: year, in: query, required: true, schema: { type: integer } }
        - { name: month, in: query, required: true, schema: { type: integer, minimum: 1, maximum: 12 } }
        - { name: transactionType, in: query, required: true, schema: { $ref: '#/components/schemas/TransactionType' } }
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, const: true }
                  data: { $ref: '#/components/schemas/CategoryBreakdown' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /dashboard/recent:
    get:
      summary: 최근 기록 5건
      responses: { '200': { description: 성공 } }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    CategoryId: { name: categoryId, in: path, required: true, schema: { type: integer, format: int64 } }
    RecordId: { name: recordId, in: path, required: true, schema: { type: integer, format: int64 } }
  schemas:
    TransactionType: { type: string, enum: [INCOME, EXPENSE] }
    TrendUnit: { type: string, enum: [DAILY, MONTHLY, YEARLY] }
    ProfitTrendPoint:
      type: object
      required: [period, totalIncome, totalExpense, netProfit]
      properties:
        period: { type: string, examples: ['2026-08-01', '2026-08', '2026'] }
        totalIncome: { type: number }
        totalExpense: { type: number }
        netProfit: { type: number }
    CategoryBreakdownItem:
      type: object
      required: [categoryId, categoryName, amount, percentage]
      properties:
        categoryId: { type: integer, format: int64 }
        categoryName: { type: string }
        amount: { type: number }
        percentage: { type: number, description: 전체 금액에서 차지하는 비율, 소수점 첫째 자리 }
    CategoryBreakdown:
      type: object
      required: [year, month, transactionType, startDate, endDate, totalAmount, items]
      properties:
        year: { type: integer }
        month: { type: integer }
        transactionType: { $ref: '#/components/schemas/TransactionType' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        totalAmount: { type: number }
        items:
          type: array
          items: { $ref: '#/components/schemas/CategoryBreakdownItem' }
    ImportFileAnalysis:
      type: object
      required: [fileName, status, rowCount, recordCount, noteCount, errors]
      properties:
        fileName: { type: string }
        status: { type: string, enum: [READY, DUPLICATE, INVALID] }
        rowCount: { type: integer }
        recordCount: { type: integer }
        noteCount: { type: integer }
        errors: { type: array, items: { type: string } }
    ImportColumnAnalysis:
      type: object
      required: [header, status, valueCount, totalAmount]
      properties:
        header: { type: string }
        status: { type: string, enum: [AUTO_MATCHED, NEEDS_MAPPING] }
        categoryId: { type: integer, format: int64, nullable: true }
        categoryName: { type: string, nullable: true }
        valueCount: { type: integer }
        totalAmount: { type: number }
    ImportAnalysis:
      type: object
      required: [importToken, files, columns, requiresMapping, readyFileCount, duplicateFileCount, invalidFileCount]
      properties:
        importToken: { type: string, format: uuid }
        files: { type: array, items: { $ref: '#/components/schemas/ImportFileAnalysis' } }
        columns: { type: array, items: { $ref: '#/components/schemas/ImportColumnAnalysis' } }
        requiresMapping: { type: boolean }
        readyFileCount: { type: integer }
        duplicateFileCount: { type: integer }
        invalidFileCount: { type: integer }
    ImportColumnMapping:
      type: object
      required: [header, action]
      properties:
        header: { type: string }
        action: { type: string, enum: [EXISTING, CREATE, IGNORE] }
        categoryId: { type: integer, format: int64, nullable: true }
        categoryName: { type: string, maxLength: 100, nullable: true }
        transactionType: { $ref: '#/components/schemas/TransactionType' }
        costType: { type: string, enum: [FIXED, VARIABLE, NONE], nullable: true }
        frequency: { type: string, enum: [DAILY, MONTHLY, IRREGULAR], nullable: true }
    ConfirmImportRequest:
      type: object
      required: [mappings]
      properties:
        mappings: { type: array, items: { $ref: '#/components/schemas/ImportColumnMapping' } }
    ImportResult:
      type: object
      required: [importedFileCount, duplicateFileCount, createdCategoryCount, createdRecordCount, createdNoteCount, skippedNoteCount]
      properties:
        importedFileCount: { type: integer }
        duplicateFileCount: { type: integer }
        createdCategoryCount: { type: integer }
        createdRecordCount: { type: integer }
        createdNoteCount: { type: integer }
        skippedNoteCount: { type: integer }
    Error:
      type: object
      properties:
        success: { type: boolean, const: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    BadRequest: { description: 요청값 오류 }
    Unauthorized: { description: 인증 실패 }
