spring:
  datasource:
    url: jdbc:h2:mem:sales_summery;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  jackson:
    time-zone: Asia/Seoul
  flyway:
    enabled: true

security:
  jwt:
    secret: test-only-jwt-secret-key-must-be-at-least-32-bytes
    expiration: 1h
