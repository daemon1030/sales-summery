    const LEGEND = [

    const langs = [...new Set(Object.values(NODES).map(n => n.lang).filter(Boolean))];
    if (langs.length === 0) langs.push('typescript');
    let highlighter = null;
    try { highlighter = await createHighlighter({ themes: ['vitesse-dark'], langs }); }
    catch (err) { console.warn('Shiki failed:', err); }
    const HIGHLIGHTED = {};
    for (const [id, node] of Object.entries(NODES)) {
      if (!node.code || !highlighter) continue;
      try { HIGHLIGHTED[id] = highlighter.codeToHtml(node.code, { lang: node.lang, theme: 'vitesse-dark' }); }
      catch (err) { console.warn(`Highlight failed for ${id}:`, err); }
    }

    function usePanZoom() {
      const viewportRef = useRef(null);
      const canvasRef = useRef(null);
      const zoomDisplayRef = useRef(null);
      const state = useRef({ zoom: 1, panX: 0, panY: 0 });
      const drag = useRef({ on: false, x: 0, y: 0 });

      const apply = useCallback(() => {
        const s = state.current;
        if (canvasRef.current) canvasRef.current.style.transform = `translate(${s.panX}px, ${s.panY}px) scale(${s.zoom})`;
        if (zoomDisplayRef.current) zoomDisplayRef.current.textContent = `${Math.round(s.zoom * 100)}%`;
      }, []);

      const fitToScreen = useCallback(() => {
        const svg = canvasRef.current?.querySelector('svg');
        const vp = viewportRef.current;
        if (!svg || !vp) return;
        const s = state.current;
        const sw = svg.getBoundingClientRect().width / s.zoom;
        const sh = svg.getBoundingClientRect().height / s.zoom;
        const fit = Math.max(.2, Math.min(1.5, Math.min((vp.clientWidth - 100) / sw, (vp.clientHeight - 120) / sh)));
        s.zoom = fit;
        s.panX = (vp.clientWidth - sw * fit) / 2;
        s.panY = (vp.clientHeight - sh * fit) / 2;
        apply();
      }, [apply]);

      useEffect(() => {
        const vp = viewportRef.current;
        if (!vp) return undefined;
        const onWheel = ev => {
          ev.preventDefault();
          const rect = vp.getBoundingClientRect();
          const mx = ev.clientX - rect.left;
          const my = ev.clientY - rect.top;
          const s = state.current;
          const next = Math.min(4, Math.max(.15, s.zoom * (ev.deltaY < 0 ? 1.12 : 1 / 1.12)));
          const scale = next / s.zoom;
          s.panX = mx - scale * (mx - s.panX);
          s.panY = my - scale * (my - s.panY);
          s.zoom = next;
          apply();
        };
        const onDown = ev => {
          if (ev.target.closest('.node')) return;
          drag.current = { on: true, x: ev.clientX, y: ev.clientY };
          vp.setPointerCapture(ev.pointerId);
        };
        const onMove = ev => {
          if (!drag.current.on) return;
          state.current.panX += ev.clientX - drag.current.x;
          state.current.panY += ev.clientY - drag.current.y;
          drag.current.x = ev.clientX;
          drag.current.y = ev.clientY;
          apply();
        };
        const onUp = () => { drag.current.on = false; };
        vp.addEventListener('wheel', onWheel, { passive: false });
        vp.addEventListener('pointerdown', onDown);
        vp.addEventListener('pointermove', onMove);
        vp.addEventListener('pointerup', onUp);
        vp.addEventListener('pointercancel', onUp);
        window.addEventListener('resize', fitToScreen);
        return () => {
          vp.removeEventListener('wheel', onWheel);
          vp.removeEventListener('pointerdown', onDown);
          vp.removeEventListener('pointermove', onMove);
          vp.removeEventListener('pointerup', onUp);
          vp.removeEventListener('pointercancel', onUp);
          window.removeEventListener('resize', fitToScreen);
        };
      }, [apply, fitToScreen]);

      const zoomIn = useCallback(() => { state.current.zoom = Math.min(4, state.current.zoom * 1.25); apply(); }, [apply]);
      const zoomOut = useCallback(() => { state.current.zoom = Math.max(.15, state.current.zoom / 1.25); apply(); }, [apply]);
      return { viewportRef, canvasRef, zoomDisplayRef, zoomIn, zoomOut, fitToScreen };
    }

    function MermaidDiagram({ onNodeClick }) {
      const ref = useRef(null);
      useEffect(() => {
        window.nodeClickHandler = onNodeClick;
        mermaid.initialize({
          startOnLoad: false,
          theme: 'dark',
          securityLevel: 'loose',
          themeVariables: {
            primaryColor:'#0a0a0a', primaryTextColor:'#fff', primaryBorderColor:'#2a2a2a',
            lineColor:'#a0a0a0', background:'#000', secondaryColor:'#000', tertiaryColor:'#000',
            mainBkg:'#0a0a0a', nodeBorder:'#2a2a2a', clusterBkg:'rgba(10,10,10,.8)',
            clusterBorder:'#7c3aed', titleColor:'#fff', edgeLabelBackground:'transparent'
          },
          flowchart: { useMaxWidth: false, htmlLabels: true, curve: 'basis' }
        });
        mermaid.render('walkthrough-service-frontend', DIAGRAM).then(({ svg, bindFunctions }) => {
          if (!ref.current) return;
          ref.current.innerHTML = svg;
          bindFunctions?.(ref.current);
        }).catch(err => {
          if (ref.current) ref.current.textContent = `다이어그램 렌더링 실패: ${err.message}`;
        });
        return () => { delete window.nodeClickHandler; };
      }, [onNodeClick]);
      return e('div', { ref, className: 'mermaid-wrap' });
    }

    function Summary({ collapsed, onToggle }) {
      return collapsed
        ? e('button', {
            onClick: onToggle,
            className: 'fixed top-16 left-6 z-20 px-3 py-1.5 bg-wt-surface/70 backdrop-blur border border-wt-border rounded-full text-xs text-wt-muted hover:text-white'
          }, 'ⓘ 요약 보기')
        : e('button', {
            onClick: onToggle,
            className: 'fixed top-16 left-6 z-20 max-w-xl text-left px-4 py-3 bg-wt-surface/90 backdrop-blur border border-wt-border rounded-lg shadow-xl'
          },
          e('p', { className: 'text-sm text-wt-muted leading-relaxed' }, SUMMARY),
          e('p', { className: 'text-[.65rem] text-wt-muted/50 mt-2' }, '클릭해서 접기'));
    }

    function DetailPanel({ nodeId, node, onClose }) {
      useEffect(() => {
        const onKey = ev => { if (ev.key === 'Escape') onClose(); };
        document.addEventListener('keydown', onKey);
        return () => document.removeEventListener('keydown', onKey);
      }, [onClose]);
      const codeBlock = HIGHLIGHTED[nodeId]
        ? e('div', { dangerouslySetInnerHTML: { __html: HIGHLIGHTED[nodeId] } })
        : e('pre', { className: 'code-fallback' }, e('code', null, node.code));
      return e('aside', { className: 'fixed top-4 right-4 bottom-4 w-[min(560px,calc(100vw-32px))] z-40 bg-wt-surface border border-wt-border rounded-xl shadow-2xl overflow-y-auto' },
        e('button', {
          onClick: onClose,
          'aria-label': '닫기',
          className: 'absolute top-3 right-3 w-8 h-8 rounded-md border border-wt-border bg-wt-raised text-wt-muted text-xl hover:bg-wt-red hover:text-white'
        }, '×'),
        e('div', { className: 'p-5' },
          e('h2', { className: 'text-lg font-bold pr-10 mb-3' }, node.title),
          e('div', { className: 'dt-body' }, e('p', null, node.description)),
          e('div', { className: 'dt-body' }, codeBlock),
          e('div', { className: 'mt-4 pt-3 border-t border-wt-border' },
            e('div', { className: 'text-[.7rem] uppercase tracking-wider text-wt-muted font-semibold mb-2' }, '현재 근거 파일'),
            ...node.files.map(file => e('code', { key: file, className: 'block text-sm text-wt-file font-mono mb-1' }, file))
          )
        )
      );
    }

    function ZoomControls({ pz }) {
      const buttonClass = 'w-9 h-9 border border-wt-border bg-wt-surface hover:bg-wt-raised text-sm';
      return e('div', { className: 'fixed bottom-5 left-5 z-20 flex items-center overflow-hidden rounded-lg shadow-xl' },
        e('button', { className: buttonClass, onClick: pz.zoomOut, 'aria-label': '축소' }, '−'),
        e('span', { ref: pz.zoomDisplayRef, className: 'h-9 min-w-14 px-2 flex items-center justify-center border-y border-wt-border bg-wt-surface text-xs text-wt-muted' }, '100%'),
        e('button', { className: buttonClass, onClick: pz.zoomIn, 'aria-label': '확대' }, '+'),
        e('button', { className: `${buttonClass} w-auto px-3`, onClick: pz.fitToScreen }, '맞춤')
      );
    }

    function App() {
      const [activeId, setActiveIdState] = useState(null);
      const [summaryCollapsed, setSummaryCollapsed] = useState(false);
      const pz = usePanZoom();
      const setActiveNode = useCallback(id => {
        setActiveIdState(id);
        document.querySelectorAll('.mermaid-wrap .node').forEach(node => { node.style.opacity = id ? '.35' : '1'; });
        const active = document.querySelector(`.mermaid-wrap .node[id*="${id}"]`);
        if (active) active.style.opacity = '1';
      }, []);
      const closeDetail = useCallback(() => {
        setActiveIdState(null);
        document.querySelectorAll('.mermaid-wrap .node').forEach(node => { node.style.opacity = '1'; });
      }, []);
      useEffect(() => { const timer = setTimeout(pz.fitToScreen, 900); return () => clearTimeout(timer); }, [pz.fitToScreen]);
      return e(window.React.Fragment, null,
        e('header', { className: 'fixed top-0 inset-x-0 z-10 px-6 py-3.5 bg-gradient-to-b from-black via-black/80 to-transparent pointer-events-none' },
          e('h1', { className: 'text-base font-semibold' }, '실제 서비스 프론트엔드 개발 로드맵'),
          e('p', { className: 'text-sm text-wt-muted mt-0.5' }, '기존 API 테스트 보드를 보존하면서 운영 UI를 단계적으로 구축하는 순서')
        ),
        e(Summary, { collapsed: summaryCollapsed, onToggle: () => setSummaryCollapsed(v => !v) }),
        e('main', { ref: pz.viewportRef, className: 'w-full h-screen overflow-hidden cursor-grab active:cursor-grabbing' },
          e('div', { ref: pz.canvasRef, className: 'origin-top-left will-change-transform inline-block p-[100px_70px_80px]' },
            e(MermaidDiagram, { onNodeClick: setActiveNode })
          )
        ),
        e(ZoomControls, { pz }),
        e('div', { className: 'fixed bottom-5 left-1/2 -translate-x-1/2 z-20 hidden lg:flex gap-4 px-4 py-2 bg-wt-surface border border-wt-border rounded-lg shadow-xl' },
          ...LEGEND.map(item => e('span', { key: item.label, className: 'flex items-center gap-1.5 text-xs text-wt-muted' },
            e('span', { className: `w-2 h-2 rounded-full ${item.color}` }), item.label))
        ),
        activeId && NODES[activeId] ? e(DetailPanel, { nodeId: activeId, node: NODES[activeId], onClose: closeDetail }) : null,
        e('div', { className: 'fixed bottom-5 right-5 z-20 text-xs text-wt-muted opacity-60 hidden md:block' },
          e('kbd', null, 'Scroll'), ' 확대 · ', e('kbd', null, 'Drag'), ' 이동 · 노드 클릭')
      );
    }

    window.ReactDOM.createRoot(document.getElementById('root')).render(e(App));
  </script>
</body>
</html>
